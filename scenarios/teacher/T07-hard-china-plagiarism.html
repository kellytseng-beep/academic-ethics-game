    { speaker: '學生', text: '教授，對不起這麼早打擾您，但我發現了一件很嚴重的事。' },

    { speaker: '學生', text: '我的碩士論文⋯⋯被中國期刊全文抄襲了。' },
    { speaker: '你', text: '什麼？哪本期刊？誰抄的？' },
